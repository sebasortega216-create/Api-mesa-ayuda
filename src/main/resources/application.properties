# ==============================
# Servidor
# ==============================
server.port=8080

spring.datasource.url=jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================
# Clave secreta para firmar los tokens (cambiar en producción / mover a variable de entorno)
app.jwt.secret=UnaClaveSecretaMuySeguraParaElTallerDeHelpdeskConSpringBootYJWT123456
# Duración del access token en milisegundos (15 minutos)
app.jwt.expiration-ms=900000
